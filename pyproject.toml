[project]
name = "retail-wizard"
version = "2.1.1"
description = "Local desktop retail POS, inventory, purchasing and reporting application"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1.2,<4",
  "fpdf2>=2.7.8,<3",
  "Pillow>=9,<13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
